# Third-party versions shared by every Versatia repository; published as VersatiaCatalog (see docs/build.md)
[versions]
kotlin = "2.4.20"
ksp = "2.3.12"
kotlinpoet = "2.4.0"
kctfork = "0.14.0"
paper = "1.21.4-R0.1-SNAPSHOT"
commandapi = "12.1.0"
snakeyaml = "2.4"
# Exported by VersatiaAPI and loaded on the server from VersatiaCore's libraries: (see docs/build.md)
coroutines = "1.11.0"
# Database module: Paper downloads HikariCP and these drivers through the module's plugin.yml libraries:
hikaricp = "7.1.0"
mariadb = "3.5.10"
postgresql = "42.7.14"
h2 = "2.5.252"
# Database module: provided by Paper 1.21.4 on the server class loader, never shipped
sqlite-jdbc = "3.47.0.0"
mysql-connector = "9.1.0"
testcontainers = "2.0.5"
slf4j = "2.0.9"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet-core = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }
commandapi-paper-core = { module = "dev.jorel:commandapi-paper-core", version.ref = "commandapi" }
commandapi-kotlin-paper = { module = "dev.jorel:commandapi-kotlin-paper", version.ref = "commandapi" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
# Version aligned by the JUnit BOM that kotlin("test") brings
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
